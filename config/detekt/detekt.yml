# Karalo detekt configuration.
# We build on detekt's default ruleset (see `buildUponDefaultConfig = true` in the root build.gradle.kts)
# and only override the handful of rules below.

style:
  MaxLineLength:
    maxLineLength: 120
  WildcardImport:
    active: true
  ForbiddenComment:
    active: false # allow TODO/FIXME during active development
  ReturnCount:
    max: 4 # early-return/guard-clause style is preferred over nested if/else in this codebase

complexity:
  LongParameterList:
    functionThreshold: 7
    # Raised 8 -> 9 when PlayerViewModel's Hilt constructor grew to 8 genuinely distinct
    # collaborators (adding the karaoke remote-control feature's KaraokeRepository/
    # KaraokeSessionHolder), then 9 -> 10 when it needed an @ApplicationScope CoroutineScope to fix
    # a real bug (ending an abandoned Play-Now session on the backend from onCleared(), after
    # viewModelScope is already cancelled) -- each one is a real, meaningfully-used dependency, not
    # bloat; ratchet this down only if a future refactor genuinely reduces a constructor's real
    # dependency count.
    constructorThreshold: 10
    ignoreAnnotated: ["Composable"] # TV screen composables legitimately take many display/callback params
  LongMethod:
    ignoreAnnotated: ["Composable"] # declarative UI nesting reads better than extra indirection here
  TooManyFunctions:
    thresholdInClasses: 15

naming:
  FunctionNaming:
    ignoreAnnotated: ["Composable"]

comments:
  active: false # not requiring KDoc — see CLAUDE/README code-comment conventions
