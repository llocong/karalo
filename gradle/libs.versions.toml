[versions]
# Build tooling
agp = "8.7.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"

# AndroidX / Compose
coreKtx = "1.13.1"
lifecycle = "2.8.6"
activityCompose = "1.9.2"
composeBom = "2024.10.01"
navigationCompose = "2.8.3"
tvMaterial = "1.1.0"

# Media3 / ExoPlayer
media3 = "1.4.1"

# Image loading
coil = "2.7.0"

# DI
hilt = "2.52"
hiltNavigationCompose = "1.2.0"

# WebView (used for the PoTokenProvider's BotGuard challenge — see WebViewPoTokenProvider)
webkit = "1.17.0"

# Async
coroutines = "1.9.0"

# Networking
okhttp = "4.12.0"

# YouTube extraction (pinned tag, NOT a floating branch — see ADR-0002).
# Consumed from our own fork (llocong/NewPipeExtractor, tag v0.26.5-karalo1), which carries a
# one-line patch on top of upstream v0.26.5: avoids the URLEncoder/URLDecoder Charset overloads
# (Java 10+, only implemented natively on Android API 33+ and not covered by core library
# desugaring), which otherwise crash with NoSuchMethodError on our minSdk 24. v0.26.5 (over
# v0.24.1) carries: the SABR-crash fix and PoTokenProvider interface (v0.24.6), and the
# "ContentNotAvailableException: The page needs to be reloaded" fix (v0.25.1, see
# TeamNewPipe/NewPipe#13082) — both needed for playback to work at all.
newpipeExtractor = "v0.26.5-karalo1"
desugarJdkLibs = "2.0.4"

# Firebase
firebaseBom = "33.5.1"
googleServicesPlugin = "4.4.2"
firebaseCrashlyticsPlugin = "3.0.2"

# Testing
junit5 = "5.11.0"
mockk = "1.13.13"
coroutinesTest = "1.9.0"
androidxTestExt = "1.2.1"
espresso = "3.6.1"

# Baseline Profile — see :baselineprofile module and CONTRIBUTING.md "Performance" section.
profileinstaller = "1.4.1"
benchmarkMacro = "1.5.0"
uiautomator = "2.4.0"
baselineProfile = "1.5.0"

# Karaoke remote control — see :core-karaoke and docs/adr/0005-karaoke-remote-control.md
kotlinxSerialization = "1.7.3"
datastore = "1.1.1"
zxingCore = "3.5.3"

# Code quality
ktlintPlugin = "12.1.1"
ktlintCore = "1.3.1"
detekt = "1.23.7"
kover = "0.8.3"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
