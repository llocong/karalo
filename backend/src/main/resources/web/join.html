<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join Karaoke</title>
  <link rel="stylesheet" href="/shared.css" />
</head>
<body>
  <h1>🎤 Join Karaoke</h1>

  <script src="/shared.js"></script>
  <script src="/join.js"></script>
</body>
</html>
