<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join Karaoke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared.css" />
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 32%, #4C1D95 0%, #0B0710 70%);
      display: flex;
      flex-direction: column;
    }
    .join-top {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 28px 24px;
    }
    .join-top .brand { flex-direction: column; margin-top: 4px; }
    .join-top .wordmark { font-size: 22px; margin-top: 8px; }
    .join-heading {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }
    .join-heading .headline { font-size: 16px; color: #C4B5FD; font-weight: 600; }
    .join-heading .subtitle { font-size: 13px; color: var(--muted); }
    .join-sheet {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 28px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .join-sheet .label { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; }
  </style>
</head>
<body>
  <div class="join-top">
    <div class="brand">
      <svg width="52" height="52" viewBox="0 0 96 96" fill="none">
        <rect x="6" y="6" width="84" height="84" rx="22" fill="#7C3AED"/>
        <rect x="26" y="24" width="44" height="30" rx="10" fill="none" stroke="#F5F3F7" stroke-width="3.5"/>
        <rect x="40" y="26" width="16" height="20" rx="8" fill="#F5F3F7"/>
        <line x1="42" y1="32" x2="54" y2="32" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="42" y1="38" x2="54" y2="38" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="41" y="46" width="14" height="4" rx="2" fill="#FF5D8F"/>
        <polygon points="43,50 53,50 51,70 45,70" fill="#F5F3F7"/>
        <circle cx="70" cy="66" r="7" fill="#FF5D8F"/>
        <polygon points="67.5,62.5 67.5,69.5 73,66" fill="#0B0710"/>
      </svg>
      <div class="wordmark">Karalo</div>
    </div>
    <div class="join-heading">
      <div class="headline">You're about to join the session</div>
      <p class="subtitle" id="subtitle">Checking session…</p>
      <div class="error-text" id="error" style="display:none"></div>
    </div>
  </div>
  <div class="join-sheet" id="form" style="display:none">
    <div class="label">What's your name?</div>
    <input type="text" class="pill-input" id="displayName" placeholder="Your name" maxlength="40" autofocus />
    <button class="pill-button" id="joinButton">Join Session</button>
  </div>
  <script src="/shared.js"></script>
  <script src="/join.js"></script>
</body>
</html>
