<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join Karaoke</title>
  <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <script>
    // Paint in the last-known seasonal theme before first render (see applyTheme in shared.js).
    try {
      var t = localStorage.getItem("karalo_theme");
      if (t && t !== "DEFAULT") document.documentElement.dataset.theme = t.toLowerCase();
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/shared.css" />
  <style>
    body {
      /* `100vh` is the mobile browser's "large viewport" -- as tall as the screen would be with
         the address bar fully collapsed, which is taller than what's actually on screen right
         after load. `100dvh` tracks the actually-visible viewport instead (100vh above it is
         just the fallback for browsers that don't support dvh) -- but this alone isn't enough:
         relying on .join-top/.join-heading's flex-grow to fill that height and CENTER their
         content is what pushes .join-sheet down by an amount that depends on exactly how tall
         the visible viewport is measured to be. Instead, .join-top/.join-heading below have no
         flex-grow of their own -- they take only their natural content height -- and .join-sheet
         gets `margin-top: auto` so IT'S the one absorbing any leftover space (pinning it to the
         bottom on a normal/tall screen), while never being pushed past the fold on a short one:
         worst case, the leftover space is zero and .join-sheet sits directly under the heading. */
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--join-bg);
      display: flex;
      position: relative;
      overflow-x: hidden;
      flex-direction: column;
    }
    .join-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 48px 28px 32px;
    }
    .join-top .brand { flex-direction: column; margin-top: 4px; }
    .join-top .wordmark { font-size: 22px; margin-top: 8px; }
    .join-heading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }
    .join-heading .headline { font-size: 16px; color: var(--soft); font-weight: 600; }
    .join-heading .greeting { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; color: var(--accent); }
    .bat { position: absolute; pointer-events: none; }
    .join-heading .subtitle { font-size: 13px; color: var(--muted); }
    .join-sheet {
      margin-top: auto;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 28px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .join-sheet .label { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; }
  </style>
</head>
<body>
  <svg class="bat halloween-only" style="left:40px; top:150px; width:44px;" viewBox="0 0 24 12" aria-hidden="true"><path d="M0 5 Q4 0 8 4 Q10 1 12 4 Q14 1 16 4 Q20 0 24 5 Q20 4 18 7 Q15 5 12 9 Q9 5 6 7 Q4 4 0 5Z" fill="#4A2A5E" stroke="#FF7A1A" stroke-opacity="0.55" stroke-width="0.5"/></svg>
  <svg class="bat halloween-only" style="right:48px; top:210px; width:30px; transform:rotate(14deg);" viewBox="0 0 24 12" aria-hidden="true"><path d="M0 5 Q4 0 8 4 Q10 1 12 4 Q14 1 16 4 Q20 0 24 5 Q20 4 18 7 Q15 5 12 9 Q9 5 6 7 Q4 4 0 5Z" fill="#4A2A5E" stroke="#FF7A1A" stroke-opacity="0.55" stroke-width="0.5"/></svg>
  <div class="join-top">
    <div class="brand">
      <svg width="52" height="52" viewBox="0 0 96 96" fill="none">
        <rect x="6" y="6" width="84" height="84" rx="22" fill="#7C3AED"/>
        <rect x="26" y="24" width="44" height="30" rx="10" fill="none" stroke="#F5F3F7" stroke-width="3.5"/>
        <rect x="40" y="26" width="16" height="20" rx="8" fill="#F5F3F7"/>
        <line x1="42" y1="32" x2="54" y2="32" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="42" y1="38" x2="54" y2="38" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="41" y="46" width="14" height="4" rx="2" class="logo-accent"/>
        <polygon points="43,50 53,50 51,70 45,70" fill="#F5F3F7"/>
        <circle cx="70" cy="66" r="7" class="logo-accent"/>
        <polygon points="67.5,62.5 67.5,69.5 73,66" fill="#0B0710"/>
      </svg>
      <div class="wordmark wave" role="img" aria-label="Karalo"><span>K</span><span>a</span><span>r</span><span>a</span><span>l</span><span>o</span></div>
    </div>
    <div class="join-heading">
      <div class="greeting halloween-only">Happy Halloween</div>
      <div class="headline">You're about to join the session</div>
      <p class="subtitle" id="subtitle">Checking session…</p>
      <div class="error-text" id="error" style="display:none"></div>
    </div>
  </div>
  <div class="join-sheet" id="form" style="display:none">
    <div class="label">What's your name?</div>
    <input type="text" class="pill-input" id="displayName" placeholder="Your name" maxlength="16" autocomplete="nickname" autofocus />
    <div class="field-status">
      <div class="error-text" id="nameError" role="alert"></div>
      <div class="counter" id="nameCounter">0 / 16</div>
    </div>
    <button class="pill-button" id="joinButton" disabled>Join Session</button>
  </div>
  <script src="/shared.js"></script>
  <script src="/join.js"></script>
</body>
</html>
