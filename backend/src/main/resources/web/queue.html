<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect x='6' y='6' width='84' height='84' rx='22' fill='%237C3AED'/%3E%3Crect x='40' y='26' width='16' height='20' rx='8' fill='%23F5F3F7'/%3E%3Crect x='41' y='46' width='14' height='4' rx='2' fill='%23FF5D8F'/%3E%3Cpolygon points='43,50 53,50 51,70 45,70' fill='%23F5F3F7'/%3E%3C/svg%3E" />
  <script>
    // The Queue List is now a bottom-sheet overlay on the Main Page (search.html), not its own
    // route -- this stub keeps old bookmarks/links to queue.html?sessionId=... working by landing
    // on the merged page with the sheet already open.
    var sessionId = new URLSearchParams(location.search).get("sessionId") || "";
    location.replace("/search.html?sessionId=" + encodeURIComponent(sessionId) + "&openQueue=1");
  </script>
</head>
<body></body>
</html>
